name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.filter.outputs.has-changes }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Check changed files
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            has-changes:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'tox.ini'
              - '.github/workflows/test.yml'

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install dependencies
        run: |
          uv sync --locked --no-default-groups --group lint
      - name: Run pre-commit
        shell: bash
        run: |
          uv run --no-sync pre-commit run --all-files --show-diff-on-failure

  test:
    needs: [changes]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.has-changes == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install dependencies
        # NOTE: uv sync installs the project editable by default: project root detection in tests
        # relies on package files staying in-repo
        run: |
          uv sync --locked --extra app --no-default-groups --group test
      - name: Run pytest
        run: |
          uv run --no-sync pytest tests -n auto

  status-check:
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "Status check failed for one or more jobs"
          exit 1

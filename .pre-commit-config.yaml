repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: check-json
    - id: check-toml
    - id: check-yaml
      args:
        - --unsafe
    - id: end-of-file-fixer
    - id: pretty-format-json
      args:
        - --no-sort-keys
        - --no-ensure-ascii
        - --autofix
    - id: check-merge-conflict
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.12.23
  hooks:
    - id: uv-lock
- repo: local
  hooks:
    - id: ruff
      name: ruff
      entry: ruff check
      language: system
      args:
        - --fix
      types_or: [ python, pyi ]
    - id: ruff-format
      name: ruff-format
      entry: ruff format
      language: system
      types_or: [ python, pyi ]
    - id: mypy
      name: mypy
      entry: mypy src
      pass_filenames: false
      language: system
